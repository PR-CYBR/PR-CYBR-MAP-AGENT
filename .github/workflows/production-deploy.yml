name: Production Deployment

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://prcyber-map.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production container
        run: |
          if [ -f Dockerfile ]; then
            docker build -t pr-cybr-map-agent:production .
            docker tag pr-cybr-map-agent:production pr-cybr-map-agent:production-${{ github.sha }}
            docker tag pr-cybr-map-agent:production pr-cybr-map-agent:latest
          else
            echo "No Dockerfile found"
          fi

      - name: Production deployment placeholder
        run: |
          echo "Deploying to production environment..."
          echo "Container: pr-cybr-map-agent:production-${{ github.sha }}"
          echo "This would typically:"
          echo "  1. Push to production container registry"
          echo "  2. Update production Kubernetes/ECS deployment"
          echo "  3. Perform rolling update with health checks"

  verify-production:
    name: Verify Production Deployment
    runs-on: ubuntu-latest
    needs: deploy-production
    steps:
      - name: Wait for deployment
        run: |
          echo "Waiting for production deployment to complete..."
          sleep 30

      - name: Health check
        run: |
          echo "Checking production health..."
          # curl -f https://prcyber-map.example.com/health || exit 1

      - name: Verify deployment
        run: |
          echo "Verifying production deployment..."
          # Additional verification steps

  merge-to-main:
    name: Merge to Main Branch
    runs-on: ubuntu-latest
    needs: verify-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge production to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git fetch origin
          
          # Checkout or create main branch
          if git show-ref --verify --quiet refs/heads/main; then
            git checkout main
          else
            git checkout -b main
          fi
          
          # Merge production into main
          git merge --no-ff production -m "Auto-merge production to main - Release ${{ github.sha }}"
          
          # Push to remote
          git push origin main || echo "Main branch merge will be handled manually"

      - name: Create release tag
        run: |
          git tag -a "release-$(date +%Y%m%d-%H%M%S)" -m "Production release ${{ github.sha }}"
          git push origin --tags || echo "Tag push will be handled manually"
