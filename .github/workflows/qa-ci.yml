name: QA Branch CI

on:
  push:
    branches:
      - qa
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json found"
          fi

      - name: Run integration tests
        run: |
          if [ -f package.json ]; then
            npm run test:integration || echo "No integration test script defined"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest || true

      - name: Run Python integration tests
        run: |
          if [ -d tests/integration ]; then
            pytest tests/integration/ || true
          fi

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit
        run: |
          if [ -f package.json ]; then
            npm audit --audit-level=moderate || true
          fi

      - name: Run Python safety check
        run: |
          pip install safety || true
          if [ -f requirements.txt ]; then
            safety check -r requirements.txt --exit-zero || true
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, python
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true

  build-and-scan-container:
    name: Build and Scan Container
    runs-on: ubuntu-latest
    needs: [integration-tests, security-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for QA
        run: |
          if [ -f Dockerfile ]; then
            docker build -t prcyber-map-agent:qa .
          else
            echo "No Dockerfile found"
          fi

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'prcyber-map-agent:qa'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true
        if: hashFiles('Dockerfile') != ''

  promote-to-staging:
    name: Promote to Staging
    runs-on: ubuntu-latest
    needs: build-and-scan-container
    if: github.event_name == 'push' && github.ref == 'refs/heads/qa'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git fetch origin
          
          if git show-ref --verify --quiet refs/heads/staging; then
            git checkout staging
            git merge --no-ff qa -m "Auto-merge qa to staging [skip ci]"
          else
            git checkout -b staging
          fi
          
          git push origin staging || echo "Staging branch promotion will be handled manually"
