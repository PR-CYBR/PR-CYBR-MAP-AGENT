name: Dev Branch CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json found, skipping npm install"
          fi

      - name: Run ESLint
        run: |
          if [ -f package.json ]; then
            npm run lint || echo "No lint script defined"
          else
            echo "No package.json found, skipping lint"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python linters
        run: |
          if [ -f requirements.txt ] || [ -f pyproject.toml ]; then
            pip install pylint black flake8 || true
          fi

      - name: Run Python linters
        run: |
          if [ -d src ]; then
            pylint src --exit-zero || true
            black --check src --diff || true
            flake8 src --exit-zero || true
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json found"
          fi

      - name: Run Node.js tests
        run: |
          if [ -f package.json ]; then
            npm test || echo "No test script defined"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install -e .
          fi
          pip install pytest pytest-cov || true

      - name: Run Python tests
        run: |
          if [ -d tests ]; then
            pytest tests/ --cov=src --cov-report=xml --cov-report=term || true
          fi

  validate-specs:
    name: Validate Specifications
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for spec files
        run: |
          if [ -d specs ]; then
            echo "Found specs directory"
            find specs -name "*.spec.md" -o -name "*.spec.yaml" || true
          else
            echo "No specs directory found"
          fi

      - name: Validate spec format
        run: |
          if [ -d specs ]; then
            for spec in specs/*.spec.md; do
              if [ -f "$spec" ]; then
                echo "Validating $spec"
                # Basic validation - check file is not empty
                if [ ! -s "$spec" ]; then
                  echo "Error: $spec is empty"
                  exit 1
                fi
              fi
            done
          fi

  build:
    name: Build and Test Container
    runs-on: ubuntu-latest
    needs: [test, validate-specs]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          if [ -f Dockerfile ]; then
            docker build -t pr-cybr-map-agent:dev .
          else
            echo "No Dockerfile found, skipping Docker build"
          fi

      - name: Test Docker image
        run: |
          if [ -f Dockerfile ]; then
            docker run --rm pr-cybr-map-agent:dev --version || true
          fi

  promote-to-qa:
    name: Promote to QA
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update QA branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Fetch all branches
          git fetch origin
          
          # Create QA branch if it doesn't exist
          if git show-ref --verify --quiet refs/heads/qa; then
            git checkout qa
            git merge --no-ff dev -m "Auto-merge dev to qa [skip ci]"
          else
            git checkout -b qa
          fi
          
          # Push to remote
          git push origin qa || echo "QA branch promotion will be handled manually"
